<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { display: flex; margin: 0; font-family: sans-serif; }
    .sidebar { width: 250px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .sidebar a { display: block; color: #ecf0f1; text-decoration: none; margin: 15px 0; }
    .sidebar a:hover { color: #3498db; }
    .content { flex: 1; padding: 40px; }
  </style>
</head>
<body>

  <!-- The Sidebar Element -->
  <div class="sidebar">
    <h2>Menu</h2>
    <a href="{{ '/' | relative_url }}">🏠 Home</a>
    <a href="{{ '/about.html' | relative_url }}">👤 About</a>
    <a href="{{ '/projects.html' | relative_url }}">🚀 Projects</a>
  </div>

  <!-- Main Document Target Content Injection -->
  <div class="content">
    {{ content }}
  </div>

</body>
</html>
